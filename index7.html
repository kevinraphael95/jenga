<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JENGA 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{overflow:hidden;background:#0d0a06;font-family:'Georgia',serif;user-select:none;-webkit-user-select:none;touch-action:none;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;}
#header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent);}
#logo{font-size:28px;letter-spacing:10px;color:#e8d08a;font-weight:normal;text-shadow:0 0 18px rgba(232,208,138,0.25);}
#stats{display:flex;gap:24px;}
.stat{text-align:center;min-width:50px;}
.stat-label{font-size:9px;letter-spacing:3px;color:#666;text-transform:uppercase;display:block;}
.stat-val{font-size:22px;color:#e8d08a;transition:transform 0.2s;}
.stat-val.bump{transform:scale(1.25);}
#banner{position:absolute;top:74px;left:50%;transform:translateX(-50%);padding:7px 22px;border:1px solid rgba(232,208,138,0.3);background:rgba(0,0,0,0.75);font-size:11px;letter-spacing:4px;color:#e8d08a;white-space:nowrap;transition:opacity .3s,border-color .3s;backdrop-filter:blur(4px);}
#banner.player2{border-color:rgba(140,180,255,0.4);color:#bcd2ff;}
#msg{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);padding:8px 20px;background:rgba(0,0,0,0.8);border:1px solid rgba(232,208,138,0.2);font-size:11px;letter-spacing:2px;color:#e8d08a;white-space:nowrap;transition:opacity 0.4s;pointer-events:none;}
#help{position:absolute;bottom:0;left:0;right:0;display:flex;gap:20px;justify-content:center;padding:12px 0 16px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);font-size:10px;color:#555;letter-spacing:1px;flex-wrap:wrap;}
#help b{color:#999;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);padding:1px 5px;border-radius:2px;font-weight:normal;}
#gameover{position:absolute;inset:0;background:rgba(0,0,0,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity 1s;}
#gameover.show{opacity:1;pointer-events:all;}
#go-title{font-size:52px;letter-spacing:10px;color:#e8d08a;animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#go-sub{font-size:13px;letter-spacing:4px;color:#888;}
#go-btn{margin-top:14px;padding:11px 40px;border:1px solid rgba(232,208,138,0.5);background:transparent;color:#e8d08a;font:13px 'Georgia',serif;letter-spacing:4px;cursor:pointer;transition:background .2s;}
#go-btn:hover{background:rgba(232,208,138,0.1);}
#held-info{position:absolute;top:110px;left:50%;transform:translateX(-50%);padding:6px 18px;background:rgba(0,0,0,0.75);border:1px solid rgba(232,208,138,0.4);font-size:10px;letter-spacing:3px;color:#e8d08a;display:none;}
#held-info.show{display:block;}
#loader{position:fixed;inset:0;background:#0d0a06;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:50;transition:opacity .6s;}
#loader.hide{opacity:0;pointer-events:none;}
#loader-txt{font-size:11px;letter-spacing:6px;color:#e8d08a;}
#loader-bar{width:180px;height:1px;background:rgba(232,208,138,0.2);overflow:hidden;}
#loader-bar i{display:block;height:100%;width:30%;background:#e8d08a;animation:slide 1.1s ease-in-out infinite;}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
#sound-toggle{position:absolute;top:16px;right:24px;pointer-events:all;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#e8d08a;opacity:.65;font-size:15px;transition:opacity .2s;}
#sound-toggle:hover{opacity:1;}
#tilt-bar{position:absolute;top:142px;left:50%;transform:translateX(-50%);width:120px;height:3px;background:rgba(255,255,255,0.1);display:none;}
#tilt-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#6ad06a,#e8d08a,#e85a3a);transition:width .15s;}
#rotate-btn{position:absolute;bottom:64px;right:24px;pointer-events:all;padding:8px 16px;background:rgba(0,0,0,0.75);border:1px solid rgba(232,208,138,0.4);color:#e8d08a;font:11px 'Georgia',serif;letter-spacing:2px;cursor:pointer;display:none;}
#rotate-btn.show{display:block;}
</style>
</head>
<body>
<div id="loader"><div id="loader-txt">JENGA</div><div id="loader-bar"><i></i></div></div>
<div id="ui">
  <div id="header">
    <div id="logo">JENGA</div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Hauteur</span><span class="stat-val" id="v-rows">18</span></div>
      <div class="stat"><span class="stat-label">Coups</span><span class="stat-val" id="v-moves">0</span></div>
      <div class="stat"><span class="stat-label">Joueur</span><span class="stat-val" id="v-player">1</span></div>
    </div>
  </div>
  <div id="sound-toggle">♪</div>
  <div id="banner">CHARGEMENT…</div>
  <div id="tilt-bar"><i></i></div>
  <div id="msg" style="opacity:0">—</div>
  <div id="held-info">BLOC EN MAIN — DÉPLACEZ, MOLETTE = HAUTEUR, CLIC = POSER</div>
  <button id="rotate-btn">↻ TOURNER (R)</button>
  <div id="help">
    <span><b>Survol</b> sélectionner</span>
    <span><b>Glisser</b> tirer librement</span>
    <span><b>Molette</b> hauteur / zoom</span>
    <span><b>R</b> tourner le bloc</span>
    <span><b>Clic droit</b> tourner caméra</span>
  </div>
  <div id="gameover">
    <div id="go-title">TOMBÉE !</div>
    <div id="go-sub" id="go-winner"></div>
    <button id="go-btn" onclick="location.reload()">REJOUER</button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
  "cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════════════════
// AUDIO — tiny synthesized wood-clack engine (no external assets)
// ═══════════════════════════════════════════════════════════
let actx=null, soundOn=true;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }
function clack(vol=0.5, pitch=1){
  if(!soundOn) return;
  ensureAudio();
  const t0=actx.currentTime;
  const bufSize = actx.sampleRate*0.06;
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,2);
  const noise = actx.createBufferSource(); noise.buffer=buf;
  const bp = actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = 900*pitch; bp.Q.value=1.1;
  const g = actx.createGain(); g.gain.value = vol;
  g.gain.exponentialRampToValueAtTime(0.001, t0+0.18);
  noise.connect(bp); bp.connect(g); g.connect(actx.destination);
  noise.start(t0); noise.stop(t0+0.2);

  const osc = actx.createOscillator(); osc.type='triangle';
  osc.frequency.value = 140*pitch;
  const og = actx.createGain(); og.gain.value=vol*0.35;
  og.gain.exponentialRampToValueAtTime(0.001, t0+0.12);
  osc.connect(og); og.connect(actx.destination);
  osc.start(t0); osc.stop(t0+0.12);
}
function rumble(vol=0.6){
  if(!soundOn) return;
  ensureAudio();
  const t0=actx.currentTime;
  const bufSize = actx.sampleRate*1.2;
  const buf = actx.createBuffer(1,bufSize,actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1);
  const noise = actx.createBufferSource(); noise.buffer=buf;
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
  const g = actx.createGain(); g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(vol, t0+0.15);
  g.gain.exponentialRampToValueAtTime(0.001, t0+1.2);
  noise.connect(lp); lp.connect(g); g.connect(actx.destination);
  noise.start(t0); noise.stop(t0+1.2);
}
document.getElementById('sound-toggle').addEventListener('click', ()=>{
  soundOn=!soundOn;
  document.getElementById('sound-toggle').textContent = soundOn ? '♪' : '✕';
  document.getElementById('sound-toggle').style.opacity = soundOn ? '.65' : '.35';
  if(soundOn) ensureAudio();
});

// ═══════════════════════════════════════════════════════════
// PROCEDURAL WOOD TEXTURE
// ═══════════════════════════════════════════════════════════
function makeWoodTexture(baseHex){
  const c = document.createElement('canvas'); c.width=128; c.height=128;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(baseHex);
  ctx.fillStyle = `rgb(${base.r*255|0},${base.g*255|0},${base.b*255|0})`;
  ctx.fillRect(0,0,128,128);
  for(let i=0;i<26;i++){
    const y = Math.random()*128;
    const shade = Math.random()*0.18-0.09;
    ctx.strokeStyle = `rgba(${shade<0?0:255},${shade<0?0:255},${shade<0?0:255},${Math.abs(shade)+0.06})`;
    ctx.lineWidth = 0.6+Math.random()*1.6;
    ctx.beginPath();
    ctx.moveTo(0, y+Math.random()*4-2);
    for(let x=0;x<=128;x+=16) ctx.lineTo(x, y+Math.sin(x*0.08+i)*3+Math.random()*2-1);
    ctx.stroke();
  }
  const id = ctx.getImageData(0,0,128,128);
  for(let i=0;i<id.data.length;i+=4){
    const n=(Math.random()-0.5)*10;
    id.data[i]+=n; id.data[i+1]+=n; id.data[i+2]+=n;
  }
  ctx.putImageData(id,0,0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

// ═══════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ═══════════════════════════════════════════════════════════
// SCENE / CAMERA
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100c07);
scene.fog = new THREE.Fog(0x100c07, 20, 38);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 6, 14);

const orb = new OrbitControls(camera, renderer.domElement);
orb.target.set(0, 4, 0);
orb.enableDamping = true; orb.dampingFactor = 0.08;
orb.mouseButtons = {LEFT:null, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE};
orb.touches = {ONE:null, TWO:THREE.TOUCH.DOLLY_ROTATE};
orb.minDistance = 4; orb.maxDistance = 24;
orb.maxPolarAngle = Math.PI * 0.47;
orb.update();

// ═══════════════════════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0xffe0b0, 0.55));
const sun = new THREE.DirectionalLight(0xffd080, 2.2);
sun.position.set(6,18,8); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-8; sun.shadow.camera.right=8;
sun.shadow.camera.top=22;  sun.shadow.camera.bottom=-2;
sun.shadow.camera.far=42;  sun.shadow.bias=-0.0005;
scene.add(sun);
const fill = new THREE.PointLight(0x4060aa, 0.6, 28);
fill.position.set(-5,10,-3); scene.add(fill);
const rim = new THREE.PointLight(0xffaa55, 0.5, 20);
rim.position.set(4,6,-8); scene.add(rim);

// ═══════════════════════════════════════════════════════════
// PHYSICS WORLD
// Bodies are allowed to rotate freely now (free placement), so
// shapes are built once per block at its natural size and the
// body quaternion is used normally (no more hx/hz row-swap hack).
// ═══════════════════════════════════════════════════════════
const world = new CANNON.World();
world.gravity.set(0, -9.81, 0);
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;
world.solver.iterations = 50;
world.solver.tolerance  = 0.0001;

const matWood = new CANNON.Material('wood');
const matTable= new CANNON.Material('table');

world.addContactMaterial(new CANNON.ContactMaterial(matWood, matWood, {
  friction: 0.62, restitution: 0.0,
  contactEquationStiffness: 1e8, contactEquationRelaxation: 3,
}));
world.addContactMaterial(new CANNON.ContactMaterial(matWood, matTable, {
  friction: 0.72, restitution: 0.0,
  contactEquationStiffness: 1e8, contactEquationRelaxation: 3,
}));

let lastClack = 0;
world.addEventListener('postStep', ()=>{
  const now = performance.now();
  if(now-lastClack < 70) return;
  for(const c of world.contacts){
    const rv = c.getImpactVelocityAlongNormal ? Math.abs(c.getImpactVelocityAlongNormal()) : 0;
    if(rv > 1.4){
      clack(Math.min(rv/9,0.7), 0.85+Math.random()*0.4);
      lastClack = now;
      break;
    }
  }
});

// ── Floor ──
const floorBody = new CANNON.Body({mass:0, material:matTable});
floorBody.addShape(new CANNON.Plane());
floorBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
world.addBody(floorBody);

const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x1a1208, roughness:1})
);
floorMesh.rotation.x = -Math.PI/2; floorMesh.receiveShadow = true;
scene.add(floorMesh);

// ── Table ──
const TABLE_Y = 1.0;
const TABLE_T = 0.18;

const tableBody = new CANNON.Body({mass:0, material:matTable});
tableBody.addShape(new CANNON.Box(new CANNON.Vec3(2.5, TABLE_T/2, 2.5)));
tableBody.position.set(0, TABLE_Y - TABLE_T/2, 0);
world.addBody(tableBody);

const tableTex = makeWoodTexture(0x4a2c10);
tableTex.repeat.set(2,2);
const tMesh = new THREE.Mesh(
  new THREE.BoxGeometry(5, TABLE_T, 5),
  new THREE.MeshStandardMaterial({map:tableTex, roughness:0.78, metalness:0.02})
);
tMesh.position.y = TABLE_Y - TABLE_T/2;
tMesh.receiveShadow = tMesh.castShadow = true;
scene.add(tMesh);

const legMat = new THREE.MeshStandardMaterial({color:0x3a2008, roughness:0.9});
[[-2,2],[2,2],[-2,-2],[2,-2]].forEach(([x,z])=>{
  const l = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,TABLE_Y-TABLE_T,8), legMat);
  l.position.set(x, (TABLE_Y-TABLE_T)/2, z); l.castShadow=true; scene.add(l);
});

// ═══════════════════════════════════════════════════════════
// JENGA BLOCKS
// ═══════════════════════════════════════════════════════════
const BL=1.5, BS=0.5, BH=0.30;
const GAP = 0.001;
const BASE_Y = TABLE_Y + BH/2 + GAP;

const WOOD_COLORS = [0xd4943a,0xc8862c,0xdaa040,0xca8e2a,0xe0aa44,0xb87828];
const blockTextures = WOOD_COLORS.map(makeWoodTexture);
const blocks = [];
const blockGeo = new THREE.BoxGeometry(BL, BH, BS); // canonical geometry, long axis = X

function createBlock(row, slot) {
  const isEven = (row % 2 === 0);
  const px = isEven ? 0       : slot * BS;
  const py = BASE_Y + row * BH;
  const pz = isEven ? slot*BS : 0;

  const body = new CANNON.Body({
    mass: 0, material: matWood,
    linearDamping: 0.99, angularDamping: 0.99,
  });
  body.addShape(new CANNON.Box(new CANNON.Vec3(BL/2, BH/2-GAP, BS/2)));
  body.position.set(px, py, pz);
  if(!isEven) body.quaternion.setFromEuler(0, Math.PI/2, 0);
  world.addBody(body);

  const texIdx = Math.floor(Math.random()*WOOD_COLORS.length);
  const mat = new THREE.MeshStandardMaterial({
    map: blockTextures[texIdx], roughness: 0.80, metalness: 0.03
  });
  const mesh = new THREE.Mesh(blockGeo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(blockGeo),
    new THREE.LineBasicMaterial({color:0x5a2e00, transparent:true, opacity:0.28})
  ));
  scene.add(mesh);

  const obj = {mesh, body, row, slot, alive:true};
  blocks.push(obj);
  return obj;
}

const NROWS = 18;
for(let r=0; r<NROWS; r++){
  createBlock(r,-1);
  createBlock(r, 0);
  createBlock(r,+1);
}

// ═══════════════════════════════════════════════════════════
// PHYSICS ACTIVATION — staged startup so the stack never jitters
// ═══════════════════════════════════════════════════════════
let ready = false;
const loaderEl = document.getElementById('loader');

setTimeout(()=>{
  world.gravity.set(0, 0, 0);
  blocks.forEach(b=>{
    b.body.mass = 1;
    b.body.updateMassProperties();
    b.body.type = CANNON.Body.DYNAMIC;
    b.body.linearDamping  = 0.9999;
    b.body.angularDamping = 0.9999;
    b.body.velocity.setZero();
    b.body.angularVelocity.setZero();
    b.body.wakeUp();
  });

  setTimeout(()=>{
    world.gravity.set(0, -4, 0);
    setTimeout(()=>{
      world.gravity.set(0, -9.81, 0);
      blocks.forEach(b=>{
        b.body.linearDamping  = 0.92;
        b.body.angularDamping = 0.95;
      });
      ready = true;
      setPhase('PULL');
      showMsg('Glissez un bloc pour le tirer, librement !', 4000);
      loaderEl.classList.add('hide');
    }, 600);
  }, 400);
}, 50);

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let phase = 'LOADING', player = 1, moves = 0;
let heldBlock = null, gameOver = false;
let carryHeight = 0; // extra height offset above stack top while carrying

const bannerEl = document.getElementById('banner');
const msgEl    = document.getElementById('msg');
const vRows    = document.getElementById('v-rows');
const vMoves   = document.getElementById('v-moves');
const vPlayer  = document.getElementById('v-player');
const goScreen = document.getElementById('gameover');
const goWinner = document.getElementById('go-winner');
const heldInfo = document.getElementById('held-info');
const tiltBar  = document.getElementById('tilt-bar');
const tiltBarI = tiltBar.querySelector('i');
const rotateBtn= document.getElementById('rotate-btn');

let msgT;
function showMsg(t, d=2800){
  msgEl.textContent=t; msgEl.style.opacity='1';
  clearTimeout(msgT); msgT=setTimeout(()=>msgEl.style.opacity='0', d);
}
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function maxHeight(){
  let mx = BASE_Y;
  blocks.forEach(b=>{ if(b.alive && b.body.position.y>mx) mx=b.body.position.y; });
  return mx;
}
function setPhase(p){
  phase=p;
  bannerEl.classList.toggle('player2', player===2);
  if(p==='PULL')  bannerEl.textContent=`JOUEUR ${player} — TIREZ UN BLOC`;
  if(p==='CARRY') bannerEl.textContent=`JOUEUR ${player} — PLACEZ LE BLOC`;
  if(p==='WAIT')  bannerEl.textContent='STABILISATION…';
  vRows.textContent  = Math.max(1, Math.round((maxHeight()-BASE_Y)/BH)+1);
  vMoves.textContent = moves;
  vPlayer.textContent= player;
  rotateBtn.classList.toggle('show', p==='CARRY');
  heldInfo.classList.toggle('show', p==='CARRY');
}

// ═══════════════════════════════════════════════════════════
// PULL ELIGIBILITY — height-based, no more rigid row/slot grid
// (free placement breaks the neat 3-per-row structure, so we
// just protect the topmost ~1.4 block-heights of the stack)
// ═══════════════════════════════════════════════════════════
function canPull(b){
  if(!b.alive) return false;
  const mx = maxHeight();
  if(b.body.position.y > mx - BH*1.4) return false;
  return true;
}

// ═══════════════════════════════════════════════════════════
// POINTER DRAG SYSTEM — fully free 2D movement (X & Z), plus
// adjustable carry height and free Y-axis rotation.
// ═══════════════════════════════════════════════════════════
const ray = new THREE.Raycaster();
const mNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

let hovered=null, dragging=false, dragBlock=null, activePointerId=null;
let dragOrigin = new THREE.Vector3();
let dragMouseStart = new THREE.Vector3();
let dragMaxDist = 0;
let carrying = false;
let carryYaw = 0;

function updateNDC(e){ mNDC.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); }
function planeHit(y){
  dragPlane.constant = -y;
  const pt = new THREE.Vector3();
  return ray.ray.intersectPlane(dragPlane, pt) ? pt : null;
}

renderer.domElement.addEventListener('pointermove', e=>{
  if(gameOver) return;
  updateNDC(e); ray.setFromCamera(mNDC, camera);

  // ── Pull phase: free drag, both X and Z ──
  if(dragging && dragBlock && e.pointerId===activePointerId){
    const hit = planeHit(dragBlock.body.position.y);
    if(!hit) return;
    const np = hit.clone();
    dragBlock.body.position.x = np.x;
    dragBlock.body.position.z = np.z;
    dragBlock.body.velocity.setZero();
    dragBlock.body.angularVelocity.setZero();
    const d = np.distanceTo(dragOrigin);
    dragMaxDist = Math.max(dragMaxDist, d);
    const t = Math.min(d/(BL*0.55), 1);
    dragBlock.mesh.material.emissive.setHex(0xff9900);
    dragBlock.mesh.material.emissiveIntensity = 0.08 + t*0.45;
    return;
  }

  // ── Carry phase: held block follows mouse freely above the table ──
  if(carrying && heldBlock){
    const h = maxHeight() + 1.4 + carryHeight;
    const hit = planeHit(h);
    if(hit){
      heldBlock.body.position.set(hit.x, h, hit.z);
      heldBlock.body.velocity.setZero();
      heldBlock.body.angularVelocity.setZero();
    }
    return;
  }

  if(phase !== 'PULL' || e.pointerType==='touch'){ if(phase!=='PULL') renderer.domElement.style.cursor='default'; return; }
  const pullMeshes = blocks.filter(canPull).map(b=>b.mesh);
  const hits = ray.intersectObjects(pullMeshes, false);

  if(hovered){
    hovered.mesh.material.emissive.setHex(0);
    hovered.mesh.material.emissiveIntensity=0;
    hovered=null;
  }
  if(hits.length){
    const found = blocks.find(b=>b.mesh===hits[0].object);
    if(found && canPull(found)){
      hovered=found;
      found.mesh.material.emissive.setHex(0xffd060);
      found.mesh.material.emissiveIntensity=0.25;
      renderer.domElement.style.cursor='grab';
      return;
    }
  }
  renderer.domElement.style.cursor='default';
});

renderer.domElement.addEventListener('pointerdown', e=>{
  if(gameOver) return;
  if(e.pointerType!=='touch' && e.button!==0) return;
  ensureAudio();

  // Carry phase: click anywhere = drop the block right here
  if(phase==='CARRY' && carrying){ dropBlock(); return; }
  if(phase!=='PULL') return;

  updateNDC(e); ray.setFromCamera(mNDC, camera);
  const pullMeshes = blocks.filter(canPull).map(b=>b.mesh);
  const hits = ray.intersectObjects(pullMeshes, false);
  if(!hits.length) return;

  const found = blocks.find(b=>b.mesh===hits[0].object);
  if(!found || !canPull(found)) return;

  dragging = true; dragBlock = found; activePointerId = e.pointerId;
  orb.enabled = false;
  renderer.domElement.setPointerCapture(e.pointerId);
  renderer.domElement.style.cursor = 'grabbing';
  dragMaxDist = 0;

  found.body.type = CANNON.Body.KINEMATIC;
  found.body.velocity.setZero();
  found.body.angularVelocity.setZero();

  dragOrigin.set(found.body.position.x, found.body.position.y, found.body.position.z);

  const hp = planeHit(found.body.position.y);
  if(hp) dragMouseStart.copy(hp); else dragMouseStart.copy(dragOrigin);

  if(hovered){ hovered.mesh.material.emissive.setHex(0); hovered=null; }
  found.mesh.material.emissive.setHex(0xffcc44);
  found.mesh.material.emissiveIntensity = 0.12;
});

function endDrag(e){
  if(!dragging || e.pointerId!==activePointerId) return;
  dragging=false; orb.enabled=true; activePointerId=null;
  renderer.domElement.style.cursor='default';

  if(!dragBlock) return;
  const b = dragBlock; dragBlock=null;

  if(dragMaxDist > BL*0.55){
    beginCarry(b);
  } else {
    b.body.position.copy(dragOrigin);
    b.body.velocity.setZero();
    b.body.angularVelocity.setZero();
    b.body.type = CANNON.Body.DYNAMIC;
    b.mesh.material.emissive.setHex(0);
    b.mesh.material.emissiveIntensity=0;
    showMsg('Tirez plus loin pour libérer le bloc !');
  }
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

// Scroll: zoom camera normally, but raise/lower the carried block
// when one is actively held (more intuitive than a separate UI).
renderer.domElement.addEventListener('wheel', e=>{
  if(carrying && heldBlock){
    e.preventDefault();
    carryHeight = THREE.MathUtils.clamp(carryHeight - e.deltaY*0.0025, -1.0, 3.5);
  }
}, {passive:false});

// R key: rotate the carried block 90° around Y
window.addEventListener('keydown', e=>{
  if((e.key==='r'||e.key==='R') && carrying && heldBlock) rotateHeld();
});
rotateBtn.addEventListener('click', ()=>{ if(carrying) rotateHeld(); });
function rotateHeld(){
  carryYaw += Math.PI/2;
  heldBlock.body.quaternion.setFromEuler(0, carryYaw, 0);
  clack(0.18, 1.6);
}

// ═══════════════════════════════════════════════════════════
// EXTRACT (begin carry) & DROP — fully free placement
// ═══════════════════════════════════════════════════════════
function beginCarry(b){
  b.alive = false;
  heldBlock = b;
  carrying = true;
  carryHeight = 0;
  carryYaw = 0;
  moves++;
  clack(0.45, 1.1);

  b.body.type = CANNON.Body.KINEMATIC;
  b.body.velocity.setZero();
  b.body.angularVelocity.setZero();
  b.body.quaternion.setFromEuler(0,0,0);

  b.mesh.material.emissive.setHex(0xe8c040);
  b.mesh.material.emissiveIntensity=0.5;

  setPhase('CARRY');
  showMsg('Déplacez-le où vous voulez, molette = hauteur, R = tourner, clic = poser', 5500);
}

function dropBlock(){
  if(!heldBlock) return;
  const b = heldBlock; heldBlock=null; carrying=false;
  clack(0.5, 0.7);

  b.body.type = CANNON.Body.DYNAMIC;
  b.body.velocity.set(0,-0.5,0);
  b.body.angularVelocity.setZero();
  b.body.wakeUp();
  b.alive = true;

  b.mesh.material.emissive.setHex(0);
  b.mesh.material.emissiveIntensity=0;

  bump(vRows); bump(vMoves);
  setPhase('WAIT');
  waitForSettle(b);
}

// Wait for the placed block (and stack) to actually settle instead
// of a blind fixed timeout — feels much more responsive & robust.
function waitForSettle(placedBlock){
  let stableFrames = 0;
  const maxWait = 4500;
  const startT = performance.now();
  function check(){
    if(gameOver) return;
    const v = placedBlock.body.velocity.length();
    const av = placedBlock.body.angularVelocity.length();
    if(v < 0.04 && av < 0.06) stableFrames++; else stableFrames = 0;
    if(stableFrames > 18 || performance.now()-startT > maxWait){
      endTurn();
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
}

function endTurn(){
  if(gameOver) return;
  player=(player%2)+1;
  setPhase('PULL');
  bump(vPlayer);
  showMsg(`Tour du Joueur ${player}`, 2500);
}

// ═══════════════════════════════════════════════════════════
// FALL / TILT DETECTION
// ═══════════════════════════════════════════════════════════
let fallFrames=0;
const upVec = new THREE.Vector3(0,1,0);
const tmpQ = new THREE.Quaternion();
const tmpV = new THREE.Vector3();

function towerTiltDeg(){
  let top=null, mx=-1;
  blocks.forEach(b=>{ if(b.alive && b.body.position.y>mx){mx=b.body.position.y; top=b;} });
  if(!top) return 0;
  tmpQ.set(top.body.quaternion.x, top.body.quaternion.y, top.body.quaternion.z, top.body.quaternion.w);
  tmpV.set(0,1,0).applyQuaternion(tmpQ);
  return tmpV.angleTo(upVec) * 180/Math.PI;
}

function checkFall(){
  const fell = blocks.some(b=>{
    if(!b.alive) return false;
    if(b.body.position.y < TABLE_Y-0.5) return true;
    if(Math.abs(b.body.position.x)>5 || Math.abs(b.body.position.z)>5) return true;
    return false;
  });

  if(ready && !dragging && phase!=='CARRY'){
    const tilt = towerTiltDeg();
    tiltBar.style.display = (maxHeight()-BASE_Y) > BH*3 ? 'block' : 'none';
    tiltBarI.style.width = Math.min(tilt/35*100,100)+'%';
  } else {
    tiltBar.style.display='none';
  }

  if(fell){ if(++fallFrames>15&&!gameOver) doGameOver(); }
  else fallFrames=0;
}

function doGameOver(){
  gameOver=true; phase='OVER';
  rumble(0.55);
  goWinner.textContent=`JOUEUR ${player===1?2:1} GAGNE !`;
  goScreen.classList.add('show');
}

// ═══════════════════════════════════════════════════════════
// CAMERA FOLLOW
// ═══════════════════════════════════════════════════════════
let camTY=4;
function trackCam(){
  const ideal = maxHeight() - BASE_Y + 2.5 + BASE_Y*0;
  const idealY = (maxHeight()-BASE_Y)*0.5 + BASE_Y + 2.0;
  camTY += (idealY-camTY)*0.018;
  orb.target.y += (camTY-orb.target.y)*0.05;
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP — fixed 120Hz physics step for stability
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let acc=0;
const STEP = 1/120;

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  acc+=dt;
  while(acc>=STEP){
    world.step(STEP);
    acc-=STEP;
  }
  blocks.forEach(b=>{
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
  });
  if(ready) checkFall();
  trackCam();
  orb.update();
  renderer.render(scene,camera);
}
loop();
</script>
</body>
