<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>JENGA 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#0d0a06;font-family:'Georgia',serif;user-select:none;}
canvas{display:block;}
#ui{position:fixed;inset:0;pointer-events:none;}
#header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:linear-gradient(to bottom,rgba(0,0,0,0.85),transparent);}
#logo{font-size:28px;letter-spacing:10px;color:#e8d08a;font-weight:normal;}
#stats{display:flex;gap:24px;}
.stat{text-align:center;}
.stat-label{font-size:9px;letter-spacing:3px;color:#666;text-transform:uppercase;display:block;}
.stat-val{font-size:22px;color:#e8d08a;}
#banner{position:absolute;top:74px;left:50%;transform:translateX(-50%);padding:7px 22px;border:1px solid rgba(232,208,138,0.3);background:rgba(0,0,0,0.75);font-size:11px;letter-spacing:4px;color:#e8d08a;white-space:nowrap;}
#msg{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);padding:8px 20px;background:rgba(0,0,0,0.8);border:1px solid rgba(232,208,138,0.2);font-size:11px;letter-spacing:2px;color:#e8d08a;white-space:nowrap;transition:opacity 0.4s;pointer-events:none;}
#help{position:absolute;bottom:0;left:0;right:0;display:flex;gap:24px;justify-content:center;padding:12px 0 16px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);font-size:10px;color:#555;letter-spacing:1px;}
#help b{color:#999;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);padding:1px 5px;border-radius:2px;font-weight:normal;}
#gameover{position:absolute;inset:0;background:rgba(0,0,0,0.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity 1s;}
#gameover.show{opacity:1;pointer-events:all;}
#go-title{font-size:52px;letter-spacing:10px;color:#e8d08a;}
#go-sub{font-size:13px;letter-spacing:4px;color:#888;}
#go-btn{margin-top:14px;padding:11px 40px;border:1px solid rgba(232,208,138,0.5);background:transparent;color:#e8d08a;font:13px 'Georgia',serif;letter-spacing:4px;cursor:pointer;}
#go-btn:hover{background:rgba(232,208,138,0.1);}
#held-info{position:absolute;top:110px;left:50%;transform:translateX(-50%);padding:6px 18px;background:rgba(0,0,0,0.75);border:1px solid rgba(232,208,138,0.4);font-size:10px;letter-spacing:3px;color:#e8d08a;display:none;}
#held-info.show{display:block;}
</style>

<body>
<div id="ui">
  <div id="header">
    <div id="logo">JENGA</div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Rangées</span><span class="stat-val" id="v-rows">18</span></div>
      <div class="stat"><span class="stat-label">Coups</span><span class="stat-val" id="v-moves">0</span></div>

    </div>
  </div>

  <div id="held-info">BLOC EN MAIN — CLIQUEZ POUR POSER</div>
  <div id="help">
    <span><b>Survol</b> sélectionner</span>
    <span><b>Clic + Drag</b> tirer le bloc</span>

    <span><b>Molette</b> zoom</span>
  </div>
  <div id="gameover">
    <div id="go-title">TOMBÉE !</div>
    <div id="go-sub" id="go-winner"></div>
    <button id="go-btn" onclick="location.reload()">REJOUER</button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/",
  "cannon-es":"https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
}}
</script>
<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ═══════════════════════════════════════════════════════════
// SCENE / CAMERA
// ═══════════════════════════════════════════════════════════
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100c07);
scene.fog = new THREE.Fog(0x100c07, 20, 38);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
camera.position.set(0, 6, 14);

const orb = new OrbitControls(camera, renderer.domElement);
orb.target.set(0, 4, 0);
orb.enableDamping = true; orb.dampingFactor = 0.08;
orb.mouseButtons = {LEFT:null, MIDDLE:THREE.MOUSE.DOLLY, RIGHT:THREE.MOUSE.ROTATE};
orb.touches = {ONE:null, TWO:THREE.TOUCH.DOLLY_ROTATE};
orb.minDistance = 4; orb.maxDistance = 24;
orb.maxPolarAngle = Math.PI * 0.47;
orb.update();

// ═══════════════════════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0xffe0b0, 0.55));
const sun = new THREE.DirectionalLight(0xffd080, 2.2);
sun.position.set(6,18,8); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-8; sun.shadow.camera.right=8;
sun.shadow.camera.top=22;  sun.shadow.camera.bottom=-2;
sun.shadow.camera.far=42;  sun.shadow.bias=-0.0005;
scene.add(sun);
const fill = new THREE.PointLight(0x4060aa, 0.6, 28);
fill.position.set(-5,10,-3); scene.add(fill);

// ═══════════════════════════════════════════════════════════
// PHYSICS WORLD
// KEY INSIGHT: cannon-es Box halfExtents live in LOCAL space.
// Body.quaternion rotates the BODY but the collision shape
// halfExtents do NOT rotate with it.
// SOLUTION: never rotate bodies — swap hx/hz per row instead.
// Even rows (long axis = X): hx=BL/2, hz=BS/2
// Odd  rows (long axis = Z): hx=BS/2, hz=BL/2
// No quaternion needed. Physics and visuals always match.
// ═══════════════════════════════════════════════════════════
const world = new CANNON.World();
world.gravity.set(0, -9.81, 0);   // real-world gravity, gentler
world.broadphase = new CANNON.SAPBroadphase(world);
world.allowSleep = true;

// Aggressive solver — prevents inter-penetration creep
world.solver.iterations = 40;
world.solver.tolerance  = 0.0001;

const matWood = new CANNON.Material('wood');
const matTable= new CANNON.Material('table');

// Wood-on-wood: moderate friction, zero bounce
world.addContactMaterial(new CANNON.ContactMaterial(matWood, matWood, {
  friction: 0.6,
  restitution: 0.0,
  contactEquationStiffness: 1e8,
  contactEquationRelaxation: 3,
}));
// Wood-on-table: slightly more friction
world.addContactMaterial(new CANNON.ContactMaterial(matWood, matTable, {
  friction: 0.7,
  restitution: 0.0,
  contactEquationStiffness: 1e8,
  contactEquationRelaxation: 3,
}));

// ── Floor ──
const floorBody = new CANNON.Body({mass:0, material:matTable});
floorBody.addShape(new CANNON.Plane());
floorBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
world.addBody(floorBody);

const floorMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x1a1208, roughness:1})
);
floorMesh.rotation.x = -Math.PI/2; floorMesh.receiveShadow = true;
scene.add(floorMesh);

// ── Table ──
const TABLE_Y = 1.0;
const TABLE_T = 0.18;

const tableBody = new CANNON.Body({mass:0, material:matTable});
tableBody.addShape(new CANNON.Box(new CANNON.Vec3(2.5, TABLE_T/2, 2.5)));
tableBody.position.set(0, TABLE_Y - TABLE_T/2, 0);
world.addBody(tableBody);

const tMesh = new THREE.Mesh(
  new THREE.BoxGeometry(5, TABLE_T, 5),
  new THREE.MeshStandardMaterial({color:0x4a2c10, roughness:0.78, metalness:0.02})
);
tMesh.position.y = TABLE_Y - TABLE_T/2;
tMesh.receiveShadow = tMesh.castShadow = true;
scene.add(tMesh);

const legMat = new THREE.MeshStandardMaterial({color:0x3a2008, roughness:0.9});
[[-2,2],[2,2],[-2,-2],[2,-2]].forEach(([x,z])=>{
  const l = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,TABLE_Y-TABLE_T,8), legMat);
  l.position.set(x, (TABLE_Y-TABLE_T)/2, z); l.castShadow=true; scene.add(l);
});

// ═══════════════════════════════════════════════════════════
// JENGA BLOCKS
// ═══════════════════════════════════════════════════════════
const BL=1.5, BS=0.5, BH=0.30; // long, short, height
// Small gap to prevent initial inter-penetration
const GAP = 0.001;
const BASE_Y = TABLE_Y + BH/2 + GAP;

const WOOD_COLORS = [0xd4943a,0xc8862c,0xdaa040,0xca8e2a,0xe0aa44,0xb87828];
const blocks = [];

function createBlock(row, slot) {
  // slot = -1, 0, or +1
  const isEven = (row % 2 === 0);

  // Position: even rows stack along X (offset in Z), odd along Z (offset in X)
  const px = isEven ? 0       : slot * BS;
  const py = BASE_Y + row * BH;
  const pz = isEven ? slot*BS : 0;

  // Physics shape — NO rotation on body, swap halfExtents instead
  const hx = isEven ? BL/2 : BS/2;
  const hz = isEven ? BS/2 : BL/2;

  const body = new CANNON.Body({
    mass: 0,           // STATIC during build
    material: matWood,
    linearDamping:  0.99,
    angularDamping: 0.99,
  });
  body.addShape(new CANNON.Box(new CANNON.Vec3(hx, BH/2 - GAP, hz)));
  body.position.set(px, py, pz);
  // identity quaternion — never rotate bodies
  world.addBody(body);

  // THREE mesh — geometry dimensions match physics exactly
  const gW = isEven ? BL : BS;
  const gD = isEven ? BS : BL;
  const geo = new THREE.BoxGeometry(gW, BH, gD);
  const mat = new THREE.MeshStandardMaterial({
    color: WOOD_COLORS[Math.floor(Math.random() * WOOD_COLORS.length)],
    roughness: 0.80, metalness: 0.03
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({color:0x5a2e00, transparent:true, opacity:0.28})
  ));
  scene.add(mesh);

  const obj = {mesh, body, row, slot, isEven,
               alive:true, hx, hz,
               restX:px, restY:py, restZ:pz};
  blocks.push(obj);
  return obj;
}

const NROWS = 18;
for(let r=0; r<NROWS; r++){
  createBlock(r,-1);
  createBlock(r, 0);
  createBlock(r,+1);
}

// ═══════════════════════════════════════════════════════════
// PHYSICS ACTIVATION — careful staged startup
// ═══════════════════════════════════════════════════════════
let ready = false;

// Step 1 (after 50ms): keep gravity=0, enable dynamic with maximal damping
// so any tiny float error gets absorbed without blocks moving
setTimeout(()=>{
  world.gravity.set(0, 0, 0);
  blocks.forEach(b=>{
    b.body.mass = 1;
    b.body.updateMassProperties();
    b.body.type = CANNON.Body.DYNAMIC;
    b.body.linearDamping  = 0.9999;
    b.body.angularDamping = 0.9999;
    b.body.velocity.setZero();
    b.body.angularVelocity.setZero();
    b.body.wakeUp();
  });

  // Step 2 (after 500ms): turn on gravity gradually
  setTimeout(()=>{
    world.gravity.set(0, -4, 0);

    setTimeout(()=>{
      world.gravity.set(0, -9.81, 0);
      blocks.forEach(b=>{
        b.body.linearDamping  = 0.92;
        b.body.angularDamping = 0.95;
      });
      ready = true;
      setPhase('PULL');
      showMsg('Clic + glisser pour tirer un bloc !', 4000);
    }, 600);
  }, 400);
}, 50);

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let phase = 'LOADING', player = 1, moves = 0;
let heldBlock = null, gameOver = false;

const bannerEl = document.getElementById('banner');
const msgEl    = document.getElementById('msg');
const vRows    = document.getElementById('v-rows');
const vMoves   = document.getElementById('v-moves');
const vPlayer  = document.getElementById('v-player');
const goScreen = document.getElementById('gameover');
const goWinner = document.getElementById('go-winner');
const heldInfo = document.getElementById('held-info');

let msgT;
function showMsg(t, d=2800){
  msgEl.textContent=t; msgEl.style.opacity='1';
  clearTimeout(msgT); msgT=setTimeout(()=>msgEl.style.opacity='0', d);
}
function setPhase(p){
  phase=p;
  if(p==='PULL')  bannerEl.textContent=`JOUEUR ${player} — TIREZ UN BLOC`;
  if(p==='PLACE') bannerEl.textContent=`JOUEUR ${player} — CLIQUEZ POUR POSER`;
  if(p==='WAIT')  bannerEl.textContent='STABILISATION…';
  vRows.textContent  = topRow()+1;
  vMoves.textContent = moves;
  vPlayer.textContent= player;
}

// ═══════════════════════════════════════════════════════════
// ROW HELPERS
// ═══════════════════════════════════════════════════════════
function topRow(){
  let mx=0;
  blocks.forEach(b=>{ if(b.alive && b.row>mx) mx=b.row; });
  return mx;
}
function aliveInRow(r){
  return blocks.filter(b=>b.alive && b.row===r);
}
function canPull(b){
  if(!b.alive) return false;
  if(b.row >= topRow()-1) return false;    // protect top 2 rows
  if(aliveInRow(b.row).length <= 1) return false; // can't empty a row
  return true;
}

// ═══════════════════════════════════════════════════════════
// DRAG SYSTEM
// Direct kinematic drag — block follows mouse on horizontal plane
// ═══════════════════════════════════════════════════════════
const ray = new THREE.Raycaster();
const mNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);

let hovered=null, dragging=false, dragBlock=null;
let dragAxisVec = new THREE.Vector3();
let dragSign = 1;
let dragOrigin = new THREE.Vector3(); // block center at drag start
let dragMouseStart = new THREE.Vector3(); // mouse 3D at drag start
let dragDist = 0; // how far pulled along axis

function updateNDC(e){ mNDC.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); }

function planeHit(y){
  dragPlane.constant = -y;
  const pt = new THREE.Vector3();
  return ray.ray.intersectPlane(dragPlane, pt) ? pt : null;
}

renderer.domElement.addEventListener('mousemove', e=>{
  if(gameOver) return;
  updateNDC(e); ray.setFromCamera(mNDC, camera);

  // ── Active drag: move block kinematically ──
  if(dragging && dragBlock){
    const hit = planeHit(dragBlock.body.position.y);
    if(!hit) return;
    const moved = hit.clone().sub(dragMouseStart).dot(dragAxisVec) * dragSign;
    dragDist = THREE.MathUtils.clamp(moved, 0, BL * 1.1);
    const np = dragOrigin.clone().addScaledVector(dragAxisVec, dragDist * dragSign);
    // Move body kinematically — other blocks react in real time
    dragBlock.body.position.x = np.x;
    dragBlock.body.position.z = np.z;
    dragBlock.body.velocity.setZero();
    dragBlock.body.angularVelocity.setZero();
    // Visual feedback
    const t = Math.min(dragDist/BL, 1);
    dragBlock.mesh.material.emissive.setHex(0xff9900);
    dragBlock.mesh.material.emissiveIntensity = 0.08 + t*0.45;
    return;
  }

  // ── Hover highlight ──
  if(phase !== 'PULL'){ renderer.domElement.style.cursor='default'; return; }
  const pullMeshes = blocks.filter(canPull).map(b=>b.mesh);
  const hits = ray.intersectObjects(pullMeshes, false);

  if(hovered){
    hovered.mesh.material.emissive.setHex(0);
    hovered.mesh.material.emissiveIntensity=0;
    hovered=null;
  }
  if(hits.length){
    const found = blocks.find(b=>b.mesh===hits[0].object);
    if(found && canPull(found)){
      hovered=found;
      found.mesh.material.emissive.setHex(0xffd060);
      found.mesh.material.emissiveIntensity=0.25;
      renderer.domElement.style.cursor='grab';
      return;
    }
  }
  renderer.domElement.style.cursor='default';
});

renderer.domElement.addEventListener('mousedown', e=>{
  if(gameOver || e.button!==0) return;

  if(phase==='PLACE'){ doPlace(); return; }
  if(phase!=='PULL') return;

  updateNDC(e); ray.setFromCamera(mNDC, camera);
  const pullMeshes = blocks.filter(canPull).map(b=>b.mesh);
  const hits = ray.intersectObjects(pullMeshes, false);
  if(!hits.length) return;

  const found = blocks.find(b=>b.mesh===hits[0].object);
  if(!found || !canPull(found)) return;

  // Begin drag
  dragging = true; dragBlock = found;
  orb.enabled = false;
  renderer.domElement.style.cursor = 'grabbing';
  dragDist = 0;

  // Freeze to kinematic so WE control position, but still collides
  found.body.type = CANNON.Body.KINEMATIC;
  found.body.velocity.setZero();
  found.body.angularVelocity.setZero();

  dragOrigin.set(found.body.position.x, found.body.position.y, found.body.position.z);

  // Axis: even row → X, odd row → Z
  dragAxisVec.set(found.isEven ? 1:0, 0, found.isEven ? 0:1);

  // Mouse start hit on horizontal plane at block Y
  const hp = planeHit(found.body.position.y);
  if(hp) dragMouseStart.copy(hp); else dragMouseStart.copy(dragOrigin);

  // Pull direction: away from camera projected onto axis
  const camProj = camera.position.clone().sub(dragOrigin).dot(dragAxisVec);
  dragSign = camProj >= 0 ? 1 : -1;

  if(hovered){ hovered.mesh.material.emissive.setHex(0); hovered=null; }
  found.mesh.material.emissive.setHex(0xffcc44);
  found.mesh.material.emissiveIntensity = 0.12;
});

renderer.domElement.addEventListener('mouseup', e=>{
  if(e.button!==0 || !dragging) return;
  dragging=false; orb.enabled=true;
  renderer.domElement.style.cursor='default';

  if(!dragBlock) return;
  const b = dragBlock; dragBlock=null;

  if(dragDist > BL * 0.78){
    // Pulled far enough — extract block
    extractBlock(b);
  } else {
    // Snap back to rest position
    b.body.position.set(b.restX, b.restY, b.restZ);
    b.body.velocity.setZero();
    b.body.angularVelocity.setZero();
    b.body.type = CANNON.Body.DYNAMIC;
    b.mesh.material.emissive.setHex(0);
    b.mesh.material.emissiveIntensity=0;
    showMsg('Tirez plus loin pour retirer le bloc !');
  }
});

// ═══════════════════════════════════════════════════════════
// EXTRACT & PLACE
// ═══════════════════════════════════════════════════════════
function extractBlock(b){
  b.alive = false;
  heldBlock = b;
  moves++;

  // Park off to the side, kinematic
  b.body.type = CANNON.Body.KINEMATIC;
  b.body.velocity.setZero();
  b.body.angularVelocity.setZero();
  b.body.position.set(4, TABLE_Y + 0.5 + BH/2, 0);

  b.mesh.material.emissive.setHex(0xe8c040);
  b.mesh.material.emissiveIntensity=0.5;

  heldInfo.classList.add('show');
  setPhase('PLACE');
  showMsg('Bloc retiré ! Cliquez pour le poser en haut.', 5000);
}

function doPlace(){
  if(!heldBlock) return;
  const b = heldBlock; heldBlock=null;
  heldInfo.classList.remove('show');

  const top = topRow();
  const newRow = top + 1;
  const isEven = (newRow % 2 === 0);
  const py = BASE_Y + newRow * BH;

  // Find free slot
  const taken = new Set(aliveInRow(newRow).map(x=>x.slot));
  let freeSlot = null;
  for(const s of [0,-1,1]){ if(!taken.has(s)){freeSlot=s;break;} }
  if(freeSlot===null) freeSlot=0;

  const px = isEven ? 0 : freeSlot*BS;
  const pz = isEven ? freeSlot*BS : 0;
  const hx = isEven ? BL/2 : BS/2;
  const hz = isEven ? BS/2 : BL/2;

  // Update metadata
  b.row=newRow; b.slot=freeSlot; b.isEven=isEven;
  b.restX=px; b.restY=py; b.restZ=pz;
  b.hx=hx; b.hz=hz; b.alive=true;

  // Rebuild physics shape (may have changed orientation)
  b.body.shapes=[];
  b.body.shapeOffsets=[];
  b.body.shapeOrientations=[];
  b.body.addShape(new CANNON.Box(new CANNON.Vec3(hx, BH/2-GAP, hz)));
  b.body.mass=1;
  b.body.updateMassProperties();
  b.body.linearDamping=0.92;
  b.body.angularDamping=0.95;
  b.body.type=CANNON.Body.DYNAMIC;
  // Drop from above
  b.body.position.set(px, py+1.8, pz);
  b.body.velocity.set(0,-4,0);
  b.body.angularVelocity.setZero();
  b.body.wakeUp();

  // Rebuild THREE geometry if orientation changed
  const gW=isEven?BL:BS, gD=isEven?BS:BL;
  const newGeo=new THREE.BoxGeometry(gW,BH,gD);
  b.mesh.geometry.dispose();
  b.mesh.geometry=newGeo;
  b.mesh.children.forEach(c=>c.geometry&&c.geometry.dispose());
  b.mesh.clear();
  b.mesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(newGeo),
    new THREE.LineBasicMaterial({color:0x5a2e00,transparent:true,opacity:0.28})
  ));

  b.mesh.material.emissive.setHex(0);
  b.mesh.material.emissiveIntensity=0;

  setPhase('WAIT');
  setTimeout(endTurn, 2200);
}

function endTurn(){
  if(gameOver) return;
  player=(player%2)+1;
  setPhase('PULL');
  showMsg(`Tour du Joueur ${player}`, 2500);
}

// ═══════════════════════════════════════════════════════════
// FALL DETECTION
// ═══════════════════════════════════════════════════════════
let fallFrames=0;
function checkFall(){
  const fell = blocks.some(b=>{
    if(!b.alive) return false;
    if(b.body.position.y < TABLE_Y-0.5) return true;
    if(Math.abs(b.body.position.x)>5 || Math.abs(b.body.position.z)>5) return true;
    return false;
  });
  if(fell){ if(++fallFrames>15&&!gameOver) doGameOver(); }
  else fallFrames=0;
}

function doGameOver(){
  gameOver=true; phase='OVER';
  goWinner.textContent=`JOUEUR ${player===1?2:1} GAGNE !`;
  goScreen.classList.add('show');
}

// ═══════════════════════════════════════════════════════════
// CAMERA FOLLOW
// ═══════════════════════════════════════════════════════════
let camTY=4;
function trackCam(){
  const ideal = BASE_Y + topRow()*BH*0.5 + 2.5;
  camTY += (ideal-camTY)*0.018;
  orb.target.y += (camTY-orb.target.y)*0.05;
}

// ═══════════════════════════════════════════════════════════
// MAIN LOOP
// Fixed timestep 120Hz for physics stability
// ═══════════════════════════════════════════════════════════
const clock = new THREE.Clock();
let acc=0;
const STEP = 1/120;

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  acc+=dt;
  while(acc>=STEP){
    world.step(STEP);
    acc-=STEP;
  }
  // Sync meshes with physics
  blocks.forEach(b=>{
    b.mesh.position.copy(b.body.position);
    b.mesh.quaternion.copy(b.body.quaternion);
  });
  if(ready) checkFall();
  trackCam();
  orb.update();
  renderer.render(scene,camera);
}
loop();
</script>
