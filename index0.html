<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jenga Salon 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; }
        #instructions { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; pointer-events: none; }
    </style>
</head>
<body>
    <div id="instructions">Clic : Saisir | Déplacer souris : Porter | Lâcher : Relâcher</div>
    <script type="importmap">
        { "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2c3e50); // Couleur salon
        const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(4, 4, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);

        // --- SOL ET TABLE ---
        function createFloorAndTable() {
            const groundBody = new CANNON.Body({ mass: 0 });
            groundBody.addShape(new CANNON.Plane());
            groundBody.quaternion.setFromEuler(-Math.PI/2, 0, 0);
            world.addBody(groundBody);

            // Table
            const tableBody = new CANNON.Body({ mass: 0 });
            tableBody.addShape(new CANNON.Box(new CANNON.Vec3(2, 0.1, 2)));
            tableBody.position.set(0, 0, 0);
            world.addBody(tableBody);
            
            const tableMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.2, 4), new THREE.MeshStandardMaterial({ color: 0x5D4037 }));
            scene.add(tableMesh);
        }
        createFloorAndTable();

        // --- BLOCS ---
        let grabbedBody = null;
        const objects = [];

        function addBlock(x, y, z, w, d, rot = 0) {
            const body = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(w/2, 0.25, d/2)) });
            body.position.set(x, y + 0.1, z); // Décalé pour la table
            body.quaternion.setFromEuler(0, rot, 0);
            world.addBody(body);

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.5, d), new THREE.MeshStandardMaterial({ color: 0xdeb887 }));
            scene.add(mesh);
            objects.push({ mesh, body });
        }

        // Tour de Jenga
        for(let i=0; i<6; i++) {
            const y = 0.35 + i * 0.5;
            if(i % 2 === 0) {
                addBlock(-0.5, y, 0, 0.4, 1.2, 0);
                addBlock(0, y, 0, 0.4, 1.2, 0);
                addBlock(0.5, y, 0, 0.4, 1.2, 0);
            } else {
                addBlock(0, y, -0.5, 1.2, 0.4, Math.PI/2);
                addBlock(0, y, 0, 1.2, 0.4, Math.PI/2);
                addBlock(0, y, 0.5, 1.2, 0.4, Math.PI/2);
            }
        }

        // --- INTERACTION ---
        window.addEventListener('mousedown', (e) => {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects.map(o => o.mesh));
            if(intersects.length > 0) {
                grabbedBody = objects.find(o => o.mesh === intersects[0].object).body;
                grabbedBody.mass = 0; 
                grabbedBody.updateMassProperties();
                controls.enabled = false; // Bloque la caméra pendant le déplacement
            }
        });

        window.addEventListener('mousemove', (e) => {
            if(grabbedBody) {
                grabbedBody.position.x += e.movementX * 0.01;
                grabbedBody.position.z += e.movementY * 0.01;
            }
        });

        window.addEventListener('mouseup', () => {
            if(grabbedBody) {
                grabbedBody.mass = 1;
                grabbedBody.updateMassProperties();
                grabbedBody = null;
                controls.enabled = true;
            }
        });

        function animate() {
            world.step(1/60);
            objects.forEach(o => {
                o.mesh.position.copy(o.body.position);
                o.mesh.quaternion.copy(o.body.quaternion);
            });
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
